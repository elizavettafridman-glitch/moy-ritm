<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Мой ритм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap&subset=cyrillic">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Матовое стекло на лавандово-голубом градиенте. Одна градиентная акцентная карточка на экран, чёрные кнопки-таблетки */
:root{
  --bg:#dfe4f6;
  --ink:#15183a; --ink-2:#444a74; --muted:#7c82a8;
  --glass:rgba(255,255,255,.44); --glass-2:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.78);
  --line:rgba(21,24,58,.07); --line-2:rgba(21,24,58,.14); --track:rgba(21,24,58,.07);
  --accent:#5a6cf4; --accent-2:#3f4fd6; --accent-soft:rgba(90,108,244,.13); --accent-rgb:90,108,244;
  --grad:linear-gradient(140deg,#6170f3 0%,#8a9cff 52%,#c3d4ff 100%);
  --grad-soft:linear-gradient(180deg,#a8b6ff 0%,#7d8cf7 100%);
  --black:#0f1022; --on-black:#ffffff;
  --warn:#b4581e; --warn-soft:rgba(244,151,84,.16);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --pill:999px;
  --shadow:0 14px 34px -22px rgba(48,58,140,.45);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60% 34% at 0% 0%,rgba(178,170,246,.75) 0%,rgba(178,170,246,0) 70%),
    radial-gradient(55% 30% at 100% 12%,rgba(150,186,255,.7) 0%,rgba(150,186,255,0) 70%),
    radial-gradient(70% 40% at 50% 100%,rgba(196,204,250,.9) 0%,rgba(196,204,250,0) 70%),
    linear-gradient(180deg,#cfd6f4 0%,#e3e7f7 55%,#d8dcf4 100%);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px calc(112px + env(safe-area-inset-bottom))}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}
.card{border-radius:var(--r-xl);padding:18px;margin-top:12px}
.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{font-size:13px;color:var(--muted);font-weight:500}

/* Header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 2px 2px}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.top .phrase{margin-top:6px;font-size:14px;color:var(--ink-2);font-weight:600;max-width:30ch;text-wrap:balance}
.dayp{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 14px;border-radius:var(--pill);font-weight:700;font-size:14px}
.dayp .rg{width:28px;height:28px;position:relative}
.dayp svg{transform:rotate(-90deg)}

/* Bubbles */
.bubbles{display:flex;justify-content:center;align-items:center;margin:14px 0 4px}
.bub{width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:rgba(255,255,255,.5);border:1px solid var(--glass-line);box-shadow:inset 0 2px 10px rgba(255,255,255,.8),0 10px 24px -16px rgba(48,58,140,.5);transition:transform .15s}
.bub:active{transform:scale(.95)}
.bub b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.bub span{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.bub.mid{width:126px;height:126px;margin:0 -12px;z-index:1;background:var(--grad);color:#fff;border-color:rgba(255,255,255,.55);box-shadow:0 18px 34px -16px rgba(80,96,240,.75),inset 0 2px 12px rgba(255,255,255,.35)}
.bub.mid b{font-size:25px}
.bub.mid span{color:rgba(255,255,255,.86)}
.bub.empty b{color:var(--muted);font-weight:700;font-size:16px}
.bub.mid.empty b{color:#fff}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 22px;border-radius:var(--pill);background:var(--black);color:var(--on-black);font-weight:700;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.w{width:100%}
.btn .ic{width:36px;height:36px;margin-left:-14px;border-radius:50%;background:#fff;color:var(--black);display:grid;place-items:center}
.btn.ghost{background:var(--glass-2);color:var(--ink);border:1px solid var(--glass-line)}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:var(--pill);font-size:12px;font-weight:700;white-space:nowrap;background:var(--glass-2);color:var(--ink-2);border:1px solid var(--glass-line)}
.chip.blue{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.chip.dark{background:var(--black);color:#fff;border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.link{font-size:13px;font-weight:700;color:var(--accent-2)}
.seg{display:inline-flex;padding:4px;border-radius:var(--pill);background:var(--glass-2);border:1px solid var(--glass-line);gap:2px}
.seg button{height:32px;padding:0 14px;border-radius:var(--pill);font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(48,58,140,.4)}

/* Workout card */
.wk-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.wk-list{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;line-height:1.4;margin-top:12px}

/* Water glass */
.wcard{display:flex;gap:16px;align-items:center}
.glassw{position:relative;width:112px;flex:0 0 112px;margin:-6px -4px -6px -6px}
.glassw svg{display:block;width:100%;height:auto;overflow:visible}
.lvl{transition:transform 1s cubic-bezier(.22,.9,.25,1)}
.wv1{animation:wave 2.6s linear infinite}
.wv2{animation:wave 4s linear infinite reverse;opacity:.85}
@keyframes wave{to{transform:translateX(-50px)}}
.wv2{animation-name:wave2}@keyframes wave2{from{transform:translate(-25px,-2.5px)}to{transform:translate(-75px,-2.5px)}}
.bbl{animation:bub 3.2s ease-in infinite;transform-box:fill-box}
.bbl.b2{animation-delay:1.1s}.bbl.b3{animation-delay:2.1s}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
.drop{position:absolute;left:50%;top:-12px;width:12px;height:16px;margin-left:-6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7d8cf7;box-shadow:inset -2px -2px 0 rgba(255,255,255,.35);animation:dropf .42s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes dropf{from{transform:translateY(0) scale(.9);opacity:1}to{transform:translateY(78px) scale(1);opacity:0}}
.wcard.full .glassw svg{filter:drop-shadow(0 10px 18px rgba(90,108,244,.45))}
.wtx{flex:1;min-width:0}
.wbig{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1}
.wbig small{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:0}
.wsub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
.wbtns{display:flex;gap:8px;margin-top:14px}
.wbtns .btn{flex:1;padding:0 16px 0 14px;height:46px}
.wbtns .btn .ic{width:32px;height:32px;margin-left:-6px}
.mini1{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--glass-2);border:1px solid var(--glass-line);display:grid;place-items:center}

/* Workout row on Today */
.wkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px;border-radius:var(--r-lg);background:rgba(255,255,255,.55);border:1px solid var(--glass-line)}
.wkrow .ico{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff}
.wkrow .tx{flex:1;min-width:0}
.wkrow .tx b{display:block;font-size:15px;font-weight:700}
.wkrow .tx span{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.gcard .btn.tw{background:#fff;color:var(--black)}
.gcard .btn.tw .ic{background:var(--black);color:#fff}
.gcard .btn.tw2{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4)}
.grp.row-b{display:flex}
/* Rest timer */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:var(--pill);background:var(--black);color:#fff;box-shadow:0 16px 30px -12px rgba(15,16,34,.6);overflow:hidden;width:max-content;max-width:calc(100vw - 32px)}
.rest .lbl{color:rgba(255,255,255,.7)}
.rest b{font-size:20px;font-weight:800;min-width:52px}
.rest button{height:34px;min-width:40px;padding:0 10px;border-radius:var(--pill);background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px}
.restbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
.restbar i{display:block;height:100%;width:0;background:#9fb0ff;transition:width .25s linear}

/* Rows */
.grp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px}
.list{border-radius:var(--r-xl);padding:4px 14px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.list>.hrow:first-child{border-top:0}
.hrow .ico{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line);color:var(--accent-2);transition:all .2s}
.hrow .tx{flex:1;min-width:0}
.hrow .tx b{display:block;font-size:15px;font-weight:700}
.hrow .tx span{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow.done .ico{background:var(--grad);color:#fff;border-color:transparent}
.ck{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:#fff;transition:all .2s}
.ck svg{opacity:0}
.hrow.done .ck{background:var(--black);border-color:var(--black)}
.hrow.done .ck svg{opacity:1}
.bar{height:4px;border-radius:4px;background:var(--track);margin-top:6px;overflow:hidden;max-width:200px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--grad-soft);transition:width .4s}
.mini{display:flex;gap:6px;flex:0 0 auto}
.mini button{width:34px;height:34px;border-radius:50%;background:var(--glass-2);border:1px solid var(--glass-line);display:grid;place-items:center;color:var(--ink)}
.pop{animation:pop .35s}@keyframes pop{40%{transform:scale(1.02)}}

/* Report */
.report{background:var(--black);color:#fff;border:0}
.report .sub{color:rgba(255,255,255,.65)}
.report .btn{background:#fff;color:var(--black)}

/* Training */
.ex{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list>.ex:first-child{border-top:0}
.ex .n{width:26px;flex:0 0 26px;font-size:12px;font-weight:800;color:var(--muted);padding-top:2px}
.ex .tx{flex:1;min-width:0}
.ex .tx b{display:block;font-size:15px;font-weight:700}
.ex .tx .sub{margin-top:2px}
.ex .tx .last{font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:600}
.ex .rt{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.editbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Session */
.sess-h{display:flex;align-items:center;gap:12px;padding:2px 0 4px}
.back{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center}
.excard{border-radius:var(--r-xl);padding:16px;margin-top:12px}
.ss{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);margin-bottom:6px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,.8fr) auto;gap:8px;align-items:center;margin-top:10px}
.set .i{font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.fld{position:relative}
.fld input{width:100%;height:42px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(255,255,255,.7);padding:0 30px 0 12px;font-size:16px;font-weight:700;outline:none}
.fld input:focus{border-color:var(--accent)}
.fld em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--muted);pointer-events:none}
.rir{display:flex;gap:3px}
.rir button{width:30px;height:42px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--glass-line);font-size:13px;font-weight:800;color:var(--ink-2)}
.rir button.on{background:var(--black);color:#fff;border-color:var(--black)}
.rir-h{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,.8fr) auto;gap:8px;margin-top:12px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rir-h span:last-child{width:129px;text-align:center}
.wtoggle{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid var(--glass-line);font-weight:700;font-size:14px;width:100%}
.wtoggle.on{background:var(--black);color:#fff;border-color:var(--black)}

/* Progress */
.gcard{border-radius:var(--r-xl);padding:18px;margin-top:12px;background:var(--grad);color:#fff;box-shadow:0 20px 40px -22px rgba(80,96,240,.8);position:relative;overflow:hidden}
.gcard .lbl{color:rgba(255,255,255,.82)}
.gcard .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:8px}
.gcard .big small{font-size:16px;font-weight:700;opacity:.8}
.gcard .sub{color:rgba(255,255,255,.85)}
.gcard svg{display:block;width:100%;height:auto;margin-top:10px}
.gcard .gbtn{height:34px;padding:0 14px;border-radius:var(--pill);background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:700;font-size:13px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.trio>div{border-radius:var(--r-lg);padding:12px;background:rgba(255,255,255,.55);border:1px solid var(--glass-line)}
.trio b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.trio span{font-size:11px;color:var(--muted);font-weight:600}
.d{font-size:12px;font-weight:700}
.d.dn{color:var(--accent-2)} .d.up{color:var(--warn)}
.bars{position:relative;height:110px;margin-top:16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.blbl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px}
.blbl span{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.blbl span.on{color:var(--ink)}
.bars .b{height:100%;display:flex;align-items:flex-end}
.bars .b i{display:block;width:100%;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid var(--glass-line);min-height:6px}
.bars .b.on i{background:var(--grad-soft);border-color:transparent;box-shadow:0 10px 20px -10px rgba(80,96,240,.8)}
.bars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(90,108,244,.45)}
.cmp{display:flex;gap:8px;margin-top:12px}
.cmp select{flex:1;min-width:0;height:40px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(255,255,255,.7);padding:0 10px;font-weight:700;font-size:13px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.drow:first-of-type{border-top:0}
.drow .v{color:var(--muted)}
.drow .v.ok{color:var(--accent-2);font-weight:800}
.chart svg{display:block;width:100%;height:auto;margin-top:8px}

/* Calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 4px}
.cal-h h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;text-transform:capitalize}
.rbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.cwd,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cwd span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.cell{width:100%;min-width:0;aspect-ratio:1;max-width:100%;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:700;position:relative;background:rgba(255,255,255,.5);border:1px solid var(--glass-line)}
.cell.fut{color:#b0b5d0;background:rgba(255,255,255,.25)}
.cell.full{background:var(--grad);color:#fff;border-color:transparent}
.cell.today{outline:2px solid var(--black);outline-offset:-2px}
.cell.sel{box-shadow:0 0 0 3px rgba(90,108,244,.45)}
.cell .dt{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--black)}
.cell.full .dt{background:#fff}

/* Nav */
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:5px;border-radius:var(--pill);background:rgba(255,255,255,.62);border:1px solid var(--glass-line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 16px 34px -14px rgba(48,58,140,.45)}
.nav button{height:48px;padding:0 13px;border-radius:var(--pill);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.nav button.on{background:var(--black);color:#fff}
.nav button.on span{display:inline}
.nav button span{display:none}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(21,24,58,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;max-height:88vh;overflow-y:auto;background:#f1f3fc;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;box-shadow:0 -20px 50px -20px rgba(48,58,140,.45);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.show{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sheet p.s{margin:0 0 14px;color:var(--muted);font-size:13px;font-weight:500;line-height:1.45}
.f{margin-top:12px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 4px}
.f input,.f select{width:100%;height:48px;border-radius:var(--r-md);border:1px solid var(--line);background:#fff;padding:0 14px;font-size:16px;font-weight:600;outline:none}
.f input:focus,.f select:focus{border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{height:44px;min-width:44px;padding:0 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
.opt.on{background:var(--black);color:#fff;border-color:var(--black)}
.feel .opt{flex:1;padding:0}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:10px}
.stepper .v{font-size:44px;font-weight:800;letter-spacing:-.03em;text-align:center;flex:1}
.stepper .v small{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}
.stepper button{width:48px;height:48px;border-radius:50%;background:#f1f3fc;display:grid;place-items:center}
.sheet .btn.w{margin-top:16px}
.sum-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.sum-row:first-of-type{border-top:0}
.sum-row .tx{flex:1;min-width:0}
.sum-row b{display:block;font-size:14px;font-weight:700}
.sum-row span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;font-weight:500}
.rep{white-space:pre-wrap;font-size:13.5px;line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;font-weight:500;user-select:text;-webkit-user-select:text}
.danger{color:#b3261e;font-weight:700;font-size:13px;display:block;margin:14px auto 0}

/* Celebrate & toast */
.cel{position:fixed;inset:0;z-index:60;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s}
.cel.show{opacity:1;pointer-events:auto}
.cel .bg{position:absolute;inset:0;background:rgba(223,228,246,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cel-c{position:relative;background:var(--grad);color:#fff;border-radius:32px;padding:30px 26px;text-align:center;width:min(82vw,320px);transform:scale(.85);transition:transform .45s cubic-bezier(.2,1.4,.3,1);box-shadow:0 30px 60px -20px rgba(80,96,240,.8)}
.cel.show .cel-c{transform:scale(1)}
.cel-c .orb{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;background:#fff;color:var(--accent);display:grid;place-items:center}
.cel-c h4{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.cel-c p{margin:8px 0 18px;font-size:14px;color:rgba(255,255,255,.88)}
.cel-c button{height:46px;padding:0 26px;border-radius:var(--pill);background:#fff;color:var(--black);font-weight:800}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--black);color:#fff;font-size:14px;font-weight:700;padding:12px 18px;border-radius:var(--pill);opacity:0;transition:all .3s;z-index:70;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skel{height:120px;border-radius:var(--r-xl);margin-top:12px;background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.7),rgba(255,255,255,.35));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:28px 20px}
.empty .orb{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;background:var(--grad);color:#fff;display:grid;place-items:center}
.empty h3{margin:0;font-size:20px;font-weight:800}
.empty p{color:var(--muted);font-size:14px;line-height:1.45;margin:8px 0 18px}
.foot{text-align:center;color:var(--muted);font-size:11px;font-weight:600;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="rest" id="rest" hidden><div class="restbar"><i id="restBar"></i></div><span class="lbl">Отдых</span><b id="restT" class="num">1:30</b><button data-r="-15" aria-label="Минус 15 секунд">−15</button><button data-r="15" aria-label="Плюс 15 секунд">+15</button><button data-r="x" aria-label="Закрыть таймер">✕</button></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- Telegram ---------- */
var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand()}catch(e){}try{if(tg.isVersionAtLeast&&tg.isVersionAtLeast('6.1')){tg.setHeaderColor('#cfd6f4');tg.setBackgroundColor('#dfe4f6')}}catch(e){}}
function haptic(k){try{if(!tg||!tg.HapticFeedback)return;if(k==='success')tg.HapticFeedback.notificationOccurred('success');else tg.HapticFeedback.impactOccurred(k||'light')}catch(e){}}

/* ---------- Icons ---------- */
function sv(p,s){return '<svg width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
var I={
 pill:sv('<rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.4 8.3l5.2 7.4"/>'),
 scoop:sv('<path d="M5 10h10v2a5 5 0 0 1-10 0z"/><path d="M15 11h3a2 2 0 0 0 2-2V6"/><path d="M8 6.5c.5-1 1.5-1.5 2-1.5s1.5.5 2 1.5"/>'),
 stretch:sv('<circle cx="12" cy="6" r="2"/><path d="M12 9v6M12 10L7.5 4.5M12 10l4.5-5.5M12 15l-2.5 6M12 15l2.5 6"/>'),
 drop:sv('<path d="M12 3s6 6.4 6 11a6 6 0 0 1-12 0c0-4.6 6-11 6-11z"/>'),
 steps:sv('<path d="M7 16c-1.7 0-3-1.6-3-4.2C4 9 5.3 6 7.2 6S10 8.4 9.7 11 8.6 16 7 16z"/><path d="M5 19.5h4"/><path d="M17 12c1.7 0 3-1.6 3-4.2S18.7 2 16.8 2 14 4.4 14.3 7 15.4 12 17 12z"/><path d="M15 15.5h4"/>'),
 hand:sv('<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V12"/><path d="M14 11.5V6a1.5 1.5 0 0 1 3 0v7c0 4.4-2.5 8-7 8-2.5 0-4-1.3-5.5-3.5L3 15a1.5 1.5 0 0 1 2.4-1.8L8 15"/>'),
 book:sv('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>'),
 heart:sv('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
 pen:sv('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
 church:sv('<path d="M12 2v5M10 4h4"/><path d="M6 21V11l6-4 6 4v10"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/><path d="M3 21h18"/>'),
 core:sv('<rect x="7" y="3" width="10" height="18" rx="5"/><path d="M9.5 8h5M9.5 12h5M9.5 16h5M12 6v12"/>'),
 dumbbell:sv('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>'),
 glove:sv('<path d="M7 21h9v-3.5c2-1.2 3-3 3-5.5V8a3 3 0 0 0-3-3h-6a4 4 0 0 0-4 4v3"/><path d="M6 12a2 2 0 0 0 0 4h3"/><path d="M7 18h9"/>'),
 moon:sv('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
 run:sv('<circle cx="14" cy="4.5" r="1.8"/><path d="M9 20l3-5 3 2v4M7 12l3-3h4l2 3h3M12 9l-1.5 5"/>'),
 check:sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>',14),
 plus:sv('<path d="M12 5v14M5 12h14"/>',18),
 minus:sv('<path d="M5 12h14"/>',18),
 left:sv('<path d="M15 6l-6 6 6 6"/>'),
 right:sv('<path d="M9 6l6 6-6 6"/>'),
 arrow:sv('<path d="M7 17L17 7M9 7h8v8"/>',16),
 play:sv('<path d="M8 5v14l11-7z"/>',16),
 copy:sv('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',16),
 alert:sv('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.01"/>',18),
 spark:sv('<path d="M12 3l1.8 5.7L19.5 10l-5.7 1.8L12 17.5l-1.8-5.7L4.5 10l5.7-1.3z"/>',30),
 today:sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
 chart:sv('<path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/>'),
 cal:sv('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
 cloud:sv('<path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/><path d="M12 11v3M12 16.5v.01"/>',26)
};
var NAV=[['today','today','Сегодня'],['train','dumbbell','Тренировки'],['progress','chart','Прогресс'],['cal','cal','Календарь']];
document.querySelectorAll('#nav button').forEach(function(b,i){b.innerHTML=I[NAV[i][1]]+'<span>'+NAV[i][2]+'</span>';b.setAttribute('aria-label',NAV[i][2])});

/* ---------- Dates ---------- */
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var WDS=['вс','пн','вт','ср','чт','пт','сб'];
function pad(n){return n<10?'0'+n:''+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addD(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function fromKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
var TODAY=addD(new Date(),0),TK=key(TODAY);
function weekStart(d){return addD(d,-((d.getDay()+6)%7))}
function plural(n,a,b,c){n=Math.abs(n);var m=n%10,mm=n%100;if(m===1&&mm!==11)return a;if(m>=2&&m<=4&&(mm<12||mm>14))return b;return c}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,dg){if(n==null||isNaN(n))return '—';var s=(Math.round(n*Math.pow(10,dg||0))/Math.pow(10,dg||0)).toFixed(dg||0);if(dg)s=s.replace(/\.?0+$/,'');return s.replace('.',',')}
function kg(n){return fmt(n,1)}
function dLabel(k){var d=fromKey(k);return d.getDate()+' '+MON[d.getMonth()]}
function sleepH(s){if(!s||!s[0]||!s[1])return null;function m(t){var p=t.split(':');return +p[0]*60+ +p[1]}var x=(m(s[1])-m(s[0])+1440)%1440;return x/60}

/* ---------- Storage ---------- */
var mem={},LSP='mr2_';
var cloud=(tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9'))?tg.CloudStorage:null;
function lsGet(k){try{var v=localStorage.getItem(LSP+k);if(v!==null)return v}catch(e){}return mem.hasOwnProperty(k)?mem[k]:null}
function lsKeys(){var out=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(LSP)===0)out.push(k.slice(LSP.length))}}catch(e){}Object.keys(mem).forEach(function(k){if(out.indexOf(k)<0)out.push(k)});return out}
function sSet(k,v){mem[k]=v;try{localStorage.setItem(LSP+k,v)}catch(e){}if(cloud){try{cloud.setItem(k,v,function(){})}catch(e){}}}
function sDel(k){delete mem[k];try{localStorage.removeItem(LSP+k)}catch(e){}if(cloud){try{cloud.removeItem(k,function(){})}catch(e){}}}
function loadAll(){
  return new Promise(function(res){
    var out={};
    function local(){lsKeys().forEach(function(k){var v=lsGet(k);if(v!=null)out[k]=v});res(out)}
    if(!cloud){local();return}
    try{cloud.getKeys(function(err,keys){
      if(err||!keys){local();return}
      var chunks=[];for(var i=0;i<keys.length;i+=80)chunks.push(keys.slice(i,i+80));
      var left=chunks.length;if(!left){local();return}
      chunks.forEach(function(ch){cloud.getItems(ch,function(e2,vals){if(!e2&&vals)Object.keys(vals).forEach(function(k){if(vals[k])out[k]=vals[k]});if(--left===0){lsKeys().forEach(function(k){if(!out[k]){var v=lsGet(k);if(v)out[k]=v}});res(out)}})});
    })}catch(e){local()}
  });
}

/* ---------- State ---------- */
var DATA=null,DAYS={},SESS={},MEAS={},PROGRAM=null,BOOK=null,REAL={};
var EXPANDED={},VIEW='today',TRAIN_DAY=null,EDIT_PROG=false,SESS_KEY=null,CAL_Y=TODAY.getFullYear(),CAL_M=TODAY.getMonth(),CAL_SEL=TK,CMP=[null,null],STR_EX=null;
function day(k){if(!DAYS[k])DAYS[k]={};return DAYS[k]}
function saveDay(k){sSet('d_'+k,JSON.stringify(DAYS[k]||{}));sync(k)}
function saveSess(k){if(SESS[k])sSet('s_'+k,JSON.stringify(SESS[k]));else sDel('s_'+k);sync(k)}
function saveMeas(k){if(MEAS[k])sSet('m_'+k,JSON.stringify(MEAS[k]));else sDel('m_'+k)}
function saveProgram(){sSet('program',JSON.stringify(PROGRAM))}
function saveBook(){sSet('book',JSON.stringify(BOOK))}
function progDay(id){return PROGRAM.filter(function(p){return p.id===id})[0]}
function exById(id){var f=null;PROGRAM.forEach(function(p){p.exercises.forEach(function(e){if(e.id===id)f=e})});return f}

/* ---------- Plan of a day ---------- */
function planOf(k){var r=DAYS[k];if(r&&r.plan)return r.plan;var s=DATA.schedule||{};return s[String(fromKey(k).getDay())]||'rest'}
function isStrength(p){return /^d\d/.test(p)}
function planTitle(p){if(p==='boxing')return 'Бокс';if(p==='rest')return 'День отдыха';var d=progDay(p);return d?d.title+' · '+d.focus:'Силовая'}

/* ---------- Day checklist ---------- */
function items(k){
  var d=fromKey(k),p=planOf(k),out=[];
  out.push({id:'checkin'});
  if(p==='boxing'||isStrength(p))out.push({id:'workout'});
  if(isStrength(p))out.push({id:'cardio'});
  DATA.habits.forEach(function(h){
    if(h.type==='weekly')return;
    if(h.type==='weekday'&&d.getDay()!==h.weekday)return;
    if(h.type==='strength'&&!isStrength(p))return;
    out.push({id:h.id,h:h});
  });
  return out;
}
function isDone(it,r){
  r=r||{};var S=DATA.settings;
  switch(it.id){
    case 'checkin':return r.weight!=null;
    case 'workout':return !!r.wdone;
    case 'cardio':return !!r.cardio;
  }
  var h=it.h;if(!h)return false;
  if(h.type==='water')return (r.water||0)>=S.water.goalMl;
  if(h.type==='steps')return (r.steps||0)>=S.steps.goal;
  if(h.type==='pages')return (r.pages||0)>=S.reading.goalPages;
  return !!r[h.id];
}
function stats(k){var r=DAYS[k]||{},its=items(k),done=its.filter(function(i){return isDone(i,r)}).length;return {done:done,total:its.length,ratio:its.length?done/its.length:0,any:Object.keys(r).length>0}}
function weeklyCount(id,k){var ws=weekStart(fromKey(k||TK)),c=0;for(var i=0;i<7;i++){var r=DAYS[key(addD(ws,i))];if(r&&r[id])c++}return c}
function pending(k){var r=DAYS[k]||{};return items(k).filter(function(i){return !isDone(i,r)}).map(function(i){return i.h?i.h.title:({checkin:'Вес и чек-ин',workout:'Тренировка',cardio:'Кардио'})[i.id]})}

/* ---------- Progression ---------- */
function parseReps(s){if(!s)return null;s=String(s);if(/сек|мин/.test(s))return null;var m=s.match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return{min:+m[1],max:+m[2]};m=s.match(/(\d+)/);if(m)return{min:+m[1],max:+m[1]};return null}
function tgtOf(e,i){return e.targets?e.targets[i]||e.target:e.target}
function tgtLbl(t){return t==='fail'?'отказ':t==='semi'?'полуотказ':''}
function rnd(x){var r=(DATA.settings.progression||{}).round||0.5;return Math.round(x/r)*r}
function history(exId,before){
  return Object.keys(SESS).filter(function(k){var s=SESS[k];return s&&s.done&&(!before||k<before)&&s.sets&&s.sets[exId]&&s.sets[exId].some(function(x){return x&&x[1]>0})})
    .sort().reverse().map(function(k){return{k:k,sets:SESS[k].sets[exId].filter(function(x){return x&&x[1]>0})}});
}
function missedOf(e,sets){var rr=parseReps(e.reps);if(!rr)return false;return sets.length<e.sets||sets.some(function(x){return x[1]<rr.min})}
function advise(e,hist){
  if(e.warmup)return{act:'none'};
  if(!hist.length)return{act:'new',next:null,text:'Первый раз: подбери рабочий вес и отметь запас повторов. Со следующей тренировки будет подсказка.'};
  var sets=hist[0].sets,w=Math.max.apply(null,sets.map(function(x){return x[0]||0})),rr=parseReps(e.reps),step=e.step||2.5;
  var easy=sets.every(function(x,i){var t=tgtOf(e,i);return x[2]!=null&&x[2]>=(t==='fail'?1:3)});
  var hard=sets.some(function(x,i){return tgtOf(e,i)==='semi'&&x[2]===0});
  var up={act:'up',next:rnd(w+step)},keep={act:'keep',next:w};
  if(!rr){
    if(easy){up.text='Отказ не наступил, был запас. Добавь вес.';return up}
    var tot=sets.reduce(function(a,x){return a+x[1]},0);
    keep.text='Вес рабочий. Цель: больше повторов, чем в прошлый раз (было '+sets.map(function(x){return x[1]}).join('·')+', всего '+tot+').';return keep;
  }
  var hitTop=sets.length>=e.sets&&sets.every(function(x){return x[1]>=rr.max});
  if(missedOf(e,sets)){
    if(hist[1]&&missedOf(e,hist[1].sets)&&Math.max.apply(null,hist[1].sets.map(function(x){return x[0]||0}))===w){
      var pct=(DATA.settings.progression||{}).deloadPercent||10;
      return{act:'down',next:rnd(w*(1-pct/100)),text:'Второй раз подряд не добрала повторы. Снижаем на '+pct+'% и снова растём.'};
    }
    keep.text='Не все подходы до '+rr.min+' повторов. Оставляем вес и добираем.';return keep;
  }
  if(hitTop){
    if(hard){keep.text='Повторы есть, но на пределе, а по схеме нужен запас 1–2. Закрепи этот вес.';return keep}
    up.text=(rr.min===rr.max?'Все подходы по '+rr.max:'Верх диапазона ('+rr.max+') во всех подходах')+'. Пора тяжелее.';return up;
  }
  if(easy){up.text='Запас повторов большой, вес лёгкий. Повышаем.';return up}
  keep.text='Добирай до '+rr.max+' повторов во всех подходах, потом повышаем.';return keep;
}
function chipFor(a){
  if(!a||a.act==='none')return '';
  if(a.act==='new')return '<span class="chip">Новое</span>';
  var w=kg(a.next)+' кг';
  if(a.act==='up')return '<span class="chip dark">'+w+' ↑</span>';
  if(a.act==='down')return '<span class="chip warn">'+w+' ↓</span>';
  return '<span class="chip blue">'+w+' =</span>';
}
function lowRecovery(k){var r=DAYS[k]||{},S=DATA.settings,h=sleepH(r.sleep);var low=[];if(r.feel!=null&&r.feel<=(S.recovery||{}).lowFeel)low.push('самочувствие '+r.feel+' из 5');if(h!=null&&h<(S.sleep||{}).lowHours)low.push('сон '+fmt(h,1)+' ч');return low}

function lineSvg(pts,n,color,onGrad,labels){

  function x(i){return pl+i/Math.max(n-1,1)*(W-pl-pr)}function y(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb)}

  var lp=pts[pts.length-1],LX=x(lp[0]),LY=y(lp[1]);
  var tc=onGrad?'rgba(255,255,255,.75)':'#7c82a8',g='';
  if(!onGrad){[mn+pad2,mx-pad2].forEach(function(v){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" style="stroke:rgba(21,24,58,.08)"/><text x="0" y="'+(y(v)+4)+'" font-size="10" style="fill:'+tc+'">'+kg(v)+'</text>'});
    if(labels){g+='<text x="'+pl+'" y="'+(H-4)+'" font-size="10" style="fill:'+tc+'">'+esc(labels[0])+'</text><text x="'+(W-pr)+'" y="'+(H-4)+'" font-size="10" text-anchor="end" style="fill:'+tc+'">'+esc(labels[labels.length-1])+'</text>'}}
  var area=onGrad?'<path d="'+d+' L'+LX.toFixed(1)+' '+(H-pb)+' L'+x(pts[0][0]).toFixed(1)+' '+(H-pb)+' Z" style="fill:rgba(255,255,255,.16)"/>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График">'+g+area+'<path d="'+d+'" fill="none" style="stroke:'+color+'" stroke-width="2.4" stroke-linecap="round"/>'+
    '<circle cx="'+LX+'" cy="'+LY+'" r="5" style="fill:'+(onGrad?'#fff':color)+';stroke:'+(onGrad?'rgba(255,255,255,.4)':'#fff')+'" stroke-width="4"/>'+
    (onGrad?'<text x="'+(LX+8)+'" y="'+(LY+4)+'" font-size="11" font-weight="700" style="fill:#fff">'+kg(lp[1])+'</text>':'')+'</svg>';
}

  function dd(a,b,u){if(a==null||b==null)return '';var d=b-a;return ' ('+(d>0?'+':d<0?'−':'±')+fmt(Math.abs(d),1)+' '+u+')'}
  if(L){lines.push('Вес натощак: '+kg(L.weight)+' кг'+(P?dd(P.weight,L.weight,'кг'):''));
    var a1=avgW(0,6);if(a1!=null)lines.push('Средний вес за неделю: '+kg(a1)+' кг');
    lines.push('Грудь: '+fmt(L.chest,1)+' см'+(P?dd(P.chest,L.chest,'см'):''));lines.push('Талия: '+fmt(L.waist,1)+' см'+(P?dd(P.waist,L.waist,'см'):''));lines.push('Бёдра: '+fmt(L.hips,1)+' см'+(P?dd(P.hips,L.hips,'см'):''));}
  lines.push('');
  var str=0,box=0,car=0,cor=0,ups=[];
  for(var i=0;i<7;i++){var k=key(addD(TODAY,-6+i)),r=DAYS[k]||{},p=planOf(k);if(r.wdone&&isStrength(p))str++;if(r.wdone&&p==='boxing')box++;if(r.cardio)car++;if(r.core)cor++;
    var s=SESS[k];if(s&&s.done){progDay(s.day).exercises.forEach(function(e){if(e.warmup)return;var h=history(e.id).filter(function(x){return x.k<=k});if(h.length>1){var w1=Math.max.apply(null,h[0].sets.map(function(x){return x[0]})),w0=Math.max.apply(null,h[1].sets.map(function(x){return x[0]}));if(w1>w0)ups.push(e.name+': '+kg(w0)+' → '+kg(w1)+' кг')}})}}
  lines.push('Силовые: '+str+' · бокс: '+box+' · кардио: '+car+' · кор: '+cor);
  if(ups.length){lines.push('Рост весов:');ups.forEach(function(u){lines.push('— '+u)})}
  var sl=[];for(var j=0;j<7;j++){var hh=sleepH((DAYS[key(addD(TODAY,-j))]||{}).sleep);if(hh!=null)sl.push(hh)}
  if(sl.length)lines.push('Сон в среднем: '+fmt(sl.reduce(function(a,b){return a+b},0)/sl.length,1)+' ч');
  return lines.join('\n');
}

/* ---------- Sync to Greta ---------- */
var syncT={};
function sync(k){var url=DATA&&DATA.settings&&DATA.settings.syncUrl;if(!url)return;clearTimeout(syncT[k]);syncT[k]=setTimeout(function(){var s=stats(k);try{fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:'',date:k,plan:planOf(k),record:DAYS[k]||{},session:SESS[k]||null,done:s.done,total:s.total,pending:pending(k)})}).catch(function(){})}catch(e){}},1200)}

/* ---------- Load ---------- */
function showError(){
  $nav.hidden=true;
  $app.innerHTML='<section class="card glass empty"><div class="orb">'+I.cloud+'</div><h3>Не получилось загрузить данные</h3><p>Файл data.json не открылся. Проверь интернет и что он лежит рядом с index.html, затем попробуй ещё раз.</p><button class="btn" id="retry">Повторить</button></section>';
  document.getElementById('retry').onclick=function(){$app.innerHTML='<div class="skel"></div>';load()};
}
function applyDemo(){
  var dm=DATA.demo||{};
  (dm.weights||[]).forEach(function(w){var k=key(addD(TODAY,w[0]));if(REAL[k])return;if(!DAYS[k])DAYS[k]={};if(DAYS[k].weight==null)DAYS[k].weight=w[1]});
  (dm.days||[]).forEach(function(x){var k=key(addD(TODAY,x.offset));if(REAL[k])return;var r=DAYS[k]||(DAYS[k]={});
    Object.keys(x).forEach(function(f){if(f==='offset')return;if(f==='workout'){if(x.workout!=='rest'){r.wdone=true}var def=(DATA.schedule||{})[String(fromKey(k).getDay())];if(x.workout!==def)r.plan=x.workout;return}if(r[f]==null)r[f]=x[f]});
    Object.keys(r).forEach(function(f){if(r[f]===false)delete r[f]})});
  (dm.sessions||[]).forEach(function(x){var k=key(addD(TODAY,x.offset));if(SESS[k])return;SESS[k]={day:x.day,sets:x.sets,warm:{},cardio:true,done:true};var r=DAYS[k]||(DAYS[k]={});r.wdone=true;r.cardio=true;var def=(DATA.schedule||{})[String(fromKey(k).getDay())];if(x.day!==def)r.plan=x.day});
  (dm.measurements||[]).forEach(function(x){var k=key(addD(TODAY,x.offset));if(!MEAS[k])MEAS[k]={weight:x.weight,chest:x.chest,waist:x.waist,hips:x.hips}});
  if(dm.today&&!DAYS[TK]){DAYS[TK]=JSON.parse(JSON.stringify(dm.today))}
}
function load(){
  fetch('data.json?v='+Date.now(),{cache:'no-store'})
   .then(function(res){if(!res.ok)throw new Error(res.status);return res.json()})
   .then(function(json){if(!json||!Array.isArray(json.program)||!json.settings||!Array.isArray(json.habits))throw new Error('bad');DATA=json;return loadAll()})
   .then(function(all){
     Object.keys(all).forEach(function(k){var v;try{v=JSON.parse(all[k])}catch(e){return}
       if(k.indexOf('d_')===0){DAYS[k.slice(2)]=v;REAL[k.slice(2)]=1}else if(k.indexOf('s_')===0)SESS[k.slice(2)]=v;else if(k.indexOf('m_')===0)MEAS[k.slice(2)]=v;else if(k==='program')PROGRAM=v;else if(k==='book')BOOK=v});
     if(!Array.isArray(PROGRAM)||!PROGRAM.length)PROGRAM=JSON.parse(JSON.stringify(DATA.program));
     var rs=DATA.settings.reading||{};if(!BOOK)BOOK={title:rs.currentBook||'',total:rs.bookTotalPages||null,pagesRead:rs.bookPagesBefore||0};
     if(DATA.settings.demoMode)applyDemo();
     wasClosed=stats(TK).ratio>=1;$nav.hidden=false;render();
   })
   .catch(function(){showError()});
}
load();
})();
</script>
